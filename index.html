:root {
  /* --- 2. Typography Hierarchy (Apple Human Interface Guidelines) --- */
  --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
  --font-size-large-title: 28px;
  --font-size-title: 22px;
  --font-size-headline: 17px;
  --font-size-body: 15px;
  --font-size-footnote: 13px;
  --font-size-caption: 11px;

  --font-weight-regular: 400;
  --font-weight-semibold: 590;
  --font-weight-bold: 650;

  --line-height-tight: 1.25;
  --line-height-normal: 1.48;

  /* --- 3. Corner Radius Scale (iOS Continuous Squircles) --- */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;
  --radius-pill: 9999px;

  /* --- 4. Fluid Motion Tokens --- */
  --ease-ios: cubic-bezier(0.25, 1, 0.5, 1);
  --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.15);
  --duration-fast: 100ms;
  --duration-micro: 120ms;
  --duration-control: 180ms;
  --duration-panel: 260ms;
  --duration-modal: 350ms;

  --ink: var(--text-primary);
  --muted: var(--text-muted);
  --line: var(--separator-medium);
  --panel: var(--color-surface);
  --soft: var(--color-surface-secondary);
  --surface-secondary: var(--color-surface-secondary);
  --teal: var(--color-primary);
  --amber: var(--color-warning);
  --red: var(--ios-red);
  --green: var(--ios-green);
  --coral-primary: var(--color-primary);
  --teal-secondary: var(--color-secondary);
  --gradient-coral-action: var(--color-primary);
}

/* ================= Reset & Global Foundation ================= */
* {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  background-color: var(--body-bg-color);
  background-image: var(--body-bg-image);
  background-attachment: fixed;
  color: var(--text-primary);
  font-family: var(--font-stack);
  font-size: var(--font-size-body);
  line-height: var(--line-height-normal);
  letter-spacing: -0.015em;
  font-variant-numeric: tabular-nums;
  transition: background-color 300ms var(--ease-ios), color 240ms var(--ease-ios);
}

/* --- Liquid iOS Slim Scrollbars --- */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: var(--radius-pill);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--scrollbar-thumb-hover);
}

/* Tabular Numerals & Metric Anti-Jitter */
.summary-count,
.metric strong,
.channel-bar-count,
.count-pulse,
.analytics-kpi-card strong,
table td,
.period-stepper-label {
  font-variant-numeric: tabular-nums;
}

/* Universal iOS-Style Active Press Scale Feedback */
button:active,
.primary-action:active,
.secondary-action:active,
.ops-action:active,
.ops-action-inline:active,
.req-miss-chip:active,
.high-impact-badge-btn:active,
.segmented button:active,
.copy-btn:active,
.reject-btn:active,
.ticket-popover-close:active {
  transform: scale(0.972);
  transition: transform var(--duration-fast) var(--ease-ios);
}

/* Card Physical Surface Definition with Subtle Top Highlight */
.toolbar,
.agent,
.today-card,
.performer-card,
.analytics-card,
.systemic-miss-card,
.metric {
  box-shadow: var(--elevation-1);
  border-top: var(--card-top-highlight);
  transition: transform var(--duration-control) var(--ease-spring),
              box-shadow var(--duration-control) var(--ease-ios);
}

.toolbar:hover,
.agent:hover,
.performer-card:hover,
.analytics-card:hover,
.metric:hover {
  box-shadow: var(--elevation-2);
}

/* Screen Transitions & Settling Motion */
.analytics-container,
.performance-view-body {
  animation: iosViewFadeIn var(--duration-panel) var(--ease-ios);
}

@keyframes iosViewFadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes iosSheetSlideUp {
  from {
    opacity: 0;
    transform: translateY(24px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes iosPopoverScaleIn {
  from {
    opacity: 0;
    transform: scale(0.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.app {
  width: min(1440px, calc(100% - 40px));
  margin: 24px auto 60px;
}

/* Reduced Motion Support */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ================= 1. Clean Desktop Header & Toolbar ================= */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 28px;
  background: var(--color-surface);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  color: var(--text-primary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  position: relative;
  overflow: hidden;
  transition: box-shadow var(--duration-panel) var(--ease-ios);
}

.brand {
  display: flex;
  align-items: center;
  gap: 18px;
  min-width: 0;
}

.brand-mark {
  width: 48px;
  height: 48px;
  flex: 0 0 auto;
  border-radius: var(--radius-md);
  background: rgba(255, 125, 0, 0.16);
  object-fit: cover;
  box-shadow: 0 4px 14px rgba(255, 125, 0, 0.35), 0 0 0 1px rgba(255, 236, 209, 0.22) inset;
  transition: transform var(--duration-control) var(--ease-spring);
}

.brand-mark:hover {
  transform: scale(1.05);
}

h1 {
  margin: 0 0 3px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--text-primary);
}

p {
  margin: 0;
  color: var(--text-tertiary);
  font-size: 13px;
  font-weight: 400;
}

.connection-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
}

.connection-indicator::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
  transition: color var(--duration-control) var(--ease-ios);
}

.connection-indicator.online {
  color: var(--ios-green);
}

.connection-indicator.connecting {
  color: var(--color-warning);
}

.connection-indicator.offline {
  color: var(--text-quaternary);
}

/* ================= 2. Active Sampling Session (Command Center) ================= */
.status,
.summary,
.controls,
.auditor-tabs,
.metrics,
.agent {
  margin-top: 18px;
}

.status {
  padding: 14px 18px;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border-radius: var(--radius-lg);
  color: var(--text-secondary);
  font-size: 13.5px;
  box-shadow: var(--shadow-subtle);
}

.today-card {
  padding: 22px 28px;
  background: var(--color-surface);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  transition: box-shadow var(--duration-panel) var(--ease-ios);
}

.today-card:hover {
  box-shadow: var(--shadow-card-hover);
}

.today-card-body {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.today-card-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.session-badge-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.session-badge {
  display: inline-flex;
  align-items: center;
  width: max-content;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: rgba(21, 97, 109, 0.35);
  color: var(--papaya-whip);
  border: 1px solid rgba(21, 97, 109, 0.55);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.session-day-segmented {
  display: inline-flex;
  align-items: center;
  background: var(--color-surface-secondary);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 3px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--color-border);
  gap: 2px;
}

.session-day-btn {
  background: transparent;
  border: none;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--duration-control) var(--ease-ios);
  white-space: nowrap;
}

.session-day-btn:hover {
  color: var(--text-primary);
  background: var(--color-primary-tint);
}

.session-day-btn.active {
  background: var(--color-primary);
  color: var(--text-on-primary);
  font-weight: 700;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.20);
}

[data-theme="light"] .session-day-btn.active {
  background: #FFFFFF;
  color: var(--color-primary);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.08);
}

.session-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.session-meta {
  color: var(--text-secondary);
  font-size: 13px;
}

.today-card-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

/* Primary Action Button (Adaptive Liquid iOS Gradient) */
.primary-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0 20px;
  border: none;
  border-radius: var(--radius-pill);
  background: var(--primary-btn-bg);
  color: var(--primary-btn-text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: -0.01em;
  cursor: pointer;
  box-shadow: var(--shadow-primary-btn);
  transition: transform var(--duration-micro) var(--ease-ios),
              filter var(--duration-control) var(--ease-ios),
              box-shadow var(--duration-control) var(--ease-ios);
}

.primary-action:hover {
  filter: var(--primary-btn-hover-filter);
  box-shadow: var(--shadow-primary-btn-hover);
  transform: translateY(-1px);
}

.primary-action:active {
  transform: scale(0.96);
  filter: brightness(0.95);
}

/* Secondary Action Button (Liquid Translucent Material) */
.secondary-action,
.ops-action-inline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 40px;
  padding: 0 18px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
  background: var(--color-primary-tint);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-subtle);
  transition: transform var(--duration-micro) var(--ease-ios),
              background var(--duration-control) var(--ease-ios),
              border-color var(--duration-control) var(--ease-ios),
              color var(--duration-control) var(--ease-ios);
}

.secondary-action:hover,
.ops-action-inline:hover {
  background: var(--color-primary-tint-hover);
  border-color: var(--color-primary-tint-border);
  color: var(--text-primary);
  transform: translateY(-1px);
}

.secondary-action:active,
.ops-action-inline:active {
  transform: scale(0.96);
}

.ops-action-inline.small {
  min-height: 32px;
  padding: 0 14px;
  font-size: 12px;
  border-radius: var(--radius-pill);
}

/* Session Banner for Historical Viewing */
.session-banner-wrap:empty {
  display: none;
}

.session-banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  padding: 14px 20px;
  border: 1px solid rgba(21, 97, 109, 0.40);
  border-radius: var(--radius-lg);
  background: rgba(21, 97, 109, 0.18);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.session-banner strong {
  display: block;
  color: var(--vivid-tangerine);
  font-size: 13.5px;
  font-weight: 700;
}

.session-banner span {
  display: block;
  margin-top: 2px;
  color: var(--text-secondary);
  font-size: 12px;
}

.session-banner-actions {
  display: flex;
  gap: 8px;
}

/* ================= 3. Auditor Navigation & Toolbar Controls ================= */
.auditor-tabs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 6px;
  padding: 5px;
  background: var(--color-surface-secondary);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--radius-pill);
  border: 1px solid var(--color-border);
}

.auditor-tabs[hidden] {
  display: none;
}

.auditor-tabs button {
  min-height: 40px;
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--duration-micro) var(--ease-ios),
              background-color var(--duration-control) var(--ease-ios),
              color var(--duration-control) var(--ease-ios),
              box-shadow var(--duration-control) var(--ease-ios);
}

.auditor-tabs button:hover {
  background: var(--color-primary-tint);
  color: var(--text-primary);
}

.auditor-tabs button.active {
  background: var(--primary-btn-bg);
  color: var(--primary-btn-text);
  font-weight: 800;
  box-shadow: var(--shadow-primary-btn);
}

.auditor-tabs button:active {
  transform: scale(0.97);
}

/* Controls Toolbar (Copy All Ideal Picks + Channel Filter) */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 20px;
  background: var(--color-surface);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
}

.controls[hidden] {
  display: none;
}

#copyIdeal {
  min-height: 38px;
  padding: 0 22px;
  border: none;
  border-radius: var(--radius-pill);
  background: var(--primary-btn-bg);
  color: var(--primary-btn-text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--shadow-primary-btn);
  transition: transform var(--duration-micro) var(--ease-ios),
              filter var(--duration-control) var(--ease-ios),
              box-shadow var(--duration-control) var(--ease-ios);
}

#copyIdeal:hover {
  filter: var(--primary-btn-hover-filter);
  box-shadow: var(--shadow-primary-btn-hover);
  transform: translateY(-1px);
}

#copyIdeal:active {
  transform: scale(0.96);
  filter: brightness(0.95);
}

.segmented {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px;
  background: var(--color-surface-secondary);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
}

.segmented button {
  min-width: 68px;
  min-height: 32px;
  padding: 0 12px;
  border: none;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--duration-control) var(--ease-ios);
}

.segmented button:hover:not(.active) {
  background: var(--color-primary-tint);
  color: var(--text-primary);
}

.segmented button.active {
  background: var(--color-primary);
  color: var(--text-on-primary);
  font-weight: 700;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.20);
}

[data-theme="light"] .segmented button.active {
  background: #FFFFFF;
  color: var(--color-primary);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.08);
}

/* ================= 4. Mini Metrics & Summary Cards ================= */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}

.mini-metric {
  text-align: left;
  padding: 14px 16px;
  background: var(--color-surface);
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-lg);
  cursor: pointer;
  box-shadow: var(--shadow-subtle);
  transition: transform var(--duration-control) var(--ease-spring),
              border-color var(--duration-control) var(--ease-ios),
              box-shadow var(--duration-control) var(--ease-ios);
}

.mini-metric:hover {
  border-color: var(--color-primary-tint-border);
  background: var(--color-surface-secondary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-card);
}

.mini-metric:active {
  transform: scale(0.98);
}

.mini-metric strong {
  display: block;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.025em;
}

.mini-metric span {
  display: block;
  margin-top: 3px;
  color: var(--text-tertiary);
  font-size: 11.5px;
  font-weight: 600;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(180px, 1fr));
  gap: 14px;
}

.metric {
  padding: 20px 22px;
  background: var(--color-surface);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  transition: box-shadow var(--duration-panel) var(--ease-ios),
              border-color var(--duration-panel) var(--ease-ios),
              transform var(--duration-panel) var(--ease-spring);
}

.metric:hover {
  box-shadow: var(--shadow-card-hover);
  border-color: rgba(255, 236, 209, 0.25);
  transform: translateY(-2px);
}

.metric strong {
  display: block;
  margin-bottom: 6px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-primary);
}

.metric span {
  display: block;
  color: var(--text-tertiary);
  font-size: 13px;
  line-height: 1.5;
}

.summary-count {
  font-size: 32px !important;
  font-weight: 800;
  color: var(--text-primary) !important;
  line-height: 1.1 !important;
  letter-spacing: -0.03em;
}

/* ================= 5. Agent Cards & Auditing Tables ================= */
.agent {
  background: var(--color-surface);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  transition: box-shadow var(--duration-panel) var(--ease-ios),
              border-color var(--duration-panel) var(--ease-ios);
}

.agent:hover {
  box-shadow: var(--shadow-card-hover);
  border-color: rgba(255, 236, 209, 0.22);
}

.agent-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 22px;
  background: rgba(255, 236, 209, 0.04);
  border-bottom: 1px solid var(--color-border);
}

.agent-title {
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  cursor: pointer;
  transition: color var(--duration-control) var(--ease-ios);
}

.agent-title:hover {
  color: var(--vivid-tangerine);
}

.pill {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 10px;
  border-radius: var(--radius-pill);
  background: var(--color-primary-tint);
  color: var(--vivid-tangerine);
  border: 1px solid var(--color-primary-tint-border);
  font-size: 11.5px;
  font-weight: 700;
}

.pill.shortage {
  background: rgba(255, 69, 58, 0.16);
  color: #FF453A;
  border: 1px solid rgba(255, 69, 58, 0.32);
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1120px;
}

th,
td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--separator-subtle);
  text-align: left;
  vertical-align: middle;
  font-size: 13px;
  transition: background-color var(--duration-micro) var(--ease-ios);
}

th {
  background: rgba(255, 236, 209, 0.03);
  color: var(--text-tertiary);
  font-weight: 600;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

tr:hover td {
  background: rgba(255, 236, 209, 0.04);
}

.rank {
  font-weight: 700;
  color: var(--text-primary);
}

.rank span {
  display: block;
  margin-top: 3px;
  color: var(--text-tertiary);
  font-size: 11px;
  font-weight: 600;
}

.brief {
  min-width: 380px;
  max-width: 580px;
}

.muted {
  color: var(--text-tertiary);
}

.ticket-link {
  color: var(--vivid-tangerine);
  font-weight: 600;
  text-decoration: none;
  transition: color var(--duration-control) var(--ease-ios);
}

.ticket-link:hover {
  color: #FFA033;
  text-decoration: underline;
}

.copy-btn {
  min-width: 68px;
  min-height: 30px;
  border: 1px solid rgba(255, 125, 0, 0.38);
  border-radius: var(--radius-pill);
  background: rgba(255, 125, 0, 0.16);
  color: var(--vivid-tangerine);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow-subtle);
  transition: all var(--duration-control) var(--ease-ios);
}

.copy-btn:hover {
  background: var(--vivid-tangerine);
  border-color: var(--vivid-tangerine);
  color: var(--ink-black);
  box-shadow: 0 4px 14px rgba(255, 125, 0, 0.45);
  transform: translateY(-1px);
}

.copy-btn:active {
  transform: scale(0.96);
}

.row-actions {
  min-width: 140px;
}

.reject-btn {
  display: block;
  min-width: 80px;
  min-height: 26px;
  margin-top: 4px;
  border: 1px solid var(--separator-medium);
  border-radius: var(--radius-pill);
  background: rgba(255, 236, 209, 0.06);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--duration-control) var(--ease-ios);
}

.reject-btn:hover {
  background: rgba(255, 69, 58, 0.18);
  border-color: rgba(255, 69, 58, 0.35);
  color: #FF453A;
}

.checks,
.tags {
  min-width: 240px;
}

.check,
.tag,
.dupe {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  margin: 0 4px 4px 0;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 600;
}

.check.yes {
  background: rgba(48, 209, 88, 0.16);
  color: #30D158;
  border: 1px solid rgba(48, 209, 88, 0.32);
}

.check.no {
  background: rgba(255, 69, 58, 0.16);
  color: #FF453A;
  border: 1px solid rgba(255, 69, 58, 0.32);
}

.check.neutral {
  background: rgba(255, 236, 209, 0.08);
  color: var(--text-secondary);
  border: 1px solid var(--separator-subtle);
}

.tag {
  background: rgba(255, 159, 10, 0.16);
  color: #FF9F0A;
  border: 1px solid rgba(255, 159, 10, 0.32);
}

.muted-tag {
  background: rgba(255, 236, 209, 0.08);
  color: var(--text-tertiary);
  border: 1px solid var(--separator-subtle);
}

.duplicate {
  background: rgba(255, 236, 209, 0.04);
}

.rejected {
  opacity: 0.52;
  text-decoration: line-through;
}

.rejected .copy-btn,
.rejected .ticket-link {
  text-decoration: line-through;
}

.dupe {
  display: flex;
  width: max-content;
  margin-top: 4px;
  background: rgba(255, 69, 58, 0.16);
  color: #FF453A;
  border: 1px solid rgba(255, 69, 58, 0.32);
}

.rejected-label {
  background: rgba(255, 69, 58, 0.16);
  color: #FF453A;
  border: 1px solid rgba(255, 69, 58, 0.32);
}

.merged-child {
  opacity: 0.52;
  background: rgba(0, 0, 0, 0.30);
}

.merged-label {
  background: rgba(255, 236, 209, 0.08);
  color: var(--text-tertiary);
}

.tags-btn {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  margin: 0 0 4px 6px;
  padding: 0 10px;
  border: 1px solid rgba(255, 236, 209, 0.14);
  border-radius: var(--radius-pill);
  background: rgba(255, 236, 209, 0.08);
  color: var(--papaya-whip);
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--duration-control) var(--ease-ios);
}

.tags-btn:hover {
  background: rgba(255, 125, 0, 0.20);
  border-color: rgba(255, 125, 0, 0.40);
  color: var(--vivid-tangerine);
}

.other-tickets {
  padding: 14px 20px 20px;
  border-top: 1px solid var(--separator-subtle);
  background: rgba(255, 236, 209, 0.02);
}

.other-tickets summary {
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
}

.other-tickets select {
  width: 100%;
  margin-top: 8px;
  border: 1px solid var(--separator-medium);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  font: inherit;
  background: var(--color-surface-secondary);
  color: var(--text-primary);
}

.other-table-wrap {
  margin-top: 10px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
}

.agent-history {
  padding: 16px 20px;
  border-bottom: 1px solid var(--separator-subtle);
  background: var(--color-surface);
}

.history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.history-head strong {
  color: var(--text-primary);
}

.month-summary {
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  background: rgba(255, 236, 209, 0.04);
  transition: box-shadow var(--duration-panel) var(--ease-ios);
}

.month-summary + .month-summary {
  margin-top: 8px;
}

.month-summary summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 600;
  color: var(--text-primary);
}

.miss-table-wrap {
  overflow-x: auto;
  border-top: 1px solid var(--separator-subtle);
}

.miss-table {
  min-width: 820px;
}

.miss-table th {
  background: rgba(255, 236, 209, 0.06);
  color: var(--text-primary);
}

.pattern {
  display: inline-flex;
  min-height: 22px;
  align-items: center;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  background: rgba(255, 236, 209, 0.08);
  color: var(--text-secondary);
  font-size: 11.5px;
  font-weight: 600;
}

.pattern.major {
  background: rgba(255, 69, 58, 0.16);
  color: #FF453A;
  border: 1px solid rgba(255, 69, 58, 0.32);
}

/* ==========================================================================
   6. REDESIGNED iOS-INSPIRED OPERATIONS HUB & FLOATING BUBBLE
   ========================================================================== */

.ops-hub {
  position: fixed;
  right: 28px;
  bottom: 28px;
  z-index: 25;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
  font-family: var(--font-stack);
}

.ops-backdrop {
  position: fixed;
  inset: 0;
  z-index: 24;
  background: rgba(0, 0, 0, 0.60);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-control) var(--ease-ios);
}

.ops-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

/* Floating Trigger Bubble */
.ops-toggle {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--color-border);
  background: var(--primary-btn-bg);
  color: var(--primary-btn-text);
  box-shadow: var(--shadow-primary-btn);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform var(--duration-panel) var(--ease-spring),
              box-shadow var(--duration-control) var(--ease-ios),
              filter var(--duration-control) var(--ease-ios);
}

.ops-toggle:hover {
  transform: scale(1.08) translateY(-2px);
  filter: var(--primary-btn-hover-filter);
  box-shadow: var(--shadow-primary-btn-hover);
}

.ops-toggle:active {
  transform: scale(0.92);
}

.ops-toggle-inner {
  position: relative;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ops-toggle-icon {
  position: absolute;
  width: 22px;
  height: 22px;
  transition: transform var(--duration-panel) var(--ease-spring),
              opacity var(--duration-control) var(--ease-ios);
}

.ops-toggle-icon.icon-menu {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.ops-toggle-icon.icon-close {
  opacity: 0;
  transform: scale(0.5) rotate(-90deg);
}

.ops-toggle.active .ops-toggle-icon.icon-menu {
  opacity: 0;
  transform: scale(0.5) rotate(90deg);
}

.ops-toggle.active .ops-toggle-icon.icon-close {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

/* Liquid Frosted Menu Container */
.ops-menu {
  position: relative;
  z-index: 25;
  width: 284px;
  padding: 10px;
  border-radius: 24px;
  background: var(--color-surface-glass);
  backdrop-filter: blur(36px) saturate(200%);
  -webkit-backdrop-filter: blur(36px) saturate(200%);
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-modal);
  transform-origin: bottom right;
  opacity: 0;
  transform: scale(0.92) translateY(12px);
  pointer-events: none;
  transition: opacity var(--duration-control) var(--ease-ios),
              transform var(--duration-panel) var(--ease-spring);
}

.ops-menu.open {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}

.ops-menu-header {
  padding: 6px 12px 8px;
}

.ops-menu-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  text-transform: uppercase;
}

/* Appearance Theme Row inside Operations Bubble */
.ops-theme-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 10px;
  border-radius: 14px;
  background: transparent;
  cursor: pointer;
  user-select: none;
  transition: background var(--duration-fast) var(--ease-ios);
}

.ops-theme-row:hover {
  background: var(--color-primary-tint);
}

.ops-theme-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.ops-glyph.glyph-theme {
  background: var(--color-primary-tint);
  color: var(--color-primary);
}

.ops-glyph.glyph-theme .theme-glyph-moon {
  display: block;
}
.ops-glyph.glyph-theme .theme-glyph-sun {
  display: none;
}

[data-theme="light"] .ops-glyph.glyph-theme .theme-glyph-moon {
  display: none;
}
[data-theme="light"] .ops-glyph.glyph-theme .theme-glyph-sun {
  display: block;
  color: #D97706;
}
[data-theme="light"] .ops-glyph.glyph-theme {
  background: rgba(217, 119, 6, 0.14);
}

/* iOS Dynamic Theme Switch */
.ios-theme-switch {
  position: relative;
  width: 46px;
  height: 26px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  outline: none;
  flex-shrink: 0;
}

.ios-theme-track {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.20);
  position: relative;
  transition: background 260ms var(--ease-ios), border-color 260ms var(--ease-ios);
}

.ios-theme-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  transition: transform 260ms cubic-bezier(0.175, 0.885, 0.32, 1.25);
}

.ios-theme-switch.active .ios-theme-track {
  background: var(--color-primary);
  border-color: var(--color-primary);
}

.ios-theme-switch.active .ios-theme-thumb {
  transform: translateX(20px);
}

.ops-menu-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.ops-menu-divider {
  height: 1px;
  margin: 6px 10px;
  background: var(--separator-subtle);
}

/* Menu Item Action */
.ops-action {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border-radius: 14px;
  border: none;
  background: transparent;
  text-align: left;
  cursor: pointer;
  width: 100%;
  transition: background var(--duration-fast) var(--ease-ios),
              transform var(--duration-micro) var(--ease-ios);
}

.ops-action:hover {
  background: var(--color-primary-tint);
  transform: translateX(2px);
}

.ops-action:active {
  transform: scale(0.98);
  background: var(--color-primary-tint-hover);
}

.ops-glyph {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform var(--duration-micro) var(--ease-ios);
}

.ops-action:hover .ops-glyph {
  transform: scale(1.05);
}

.ops-glyph svg {
  width: 18px;
  height: 18px;
}

.ops-glyph.glyph-teal {
  background: var(--color-primary-tint);
  color: var(--color-primary);
}

.ops-glyph.glyph-emerald {
  background: var(--color-success-tint);
  color: var(--color-success);
}

.ops-glyph.glyph-blue {
  background: rgba(56, 189, 248, 0.16);
  color: #38BDF8;
}

.ops-glyph.glyph-indigo {
  background: rgba(99, 102, 241, 0.16);
  color: #818CF8;
}

.ops-glyph.glyph-cyan {
  background: var(--color-primary-tint);
  color: var(--teal-accent);
}

.ops-glyph.glyph-amber {
  background: rgba(245, 158, 11, 0.16);
  color: #F59E0B;
}

.ops-action-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.ops-action-text strong {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ops-action-text span {
  font-size: 11px;
  font-weight: 400;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ops-chevron {
  font-size: 18px;
  color: var(--text-tertiary);
  opacity: 0.6;
  padding-right: 4px;
  transition: transform var(--duration-fast) var(--ease-ios),
              opacity var(--duration-fast) var(--ease-ios);
}

.ops-action:hover .ops-chevron {
  opacity: 1;
  transform: translateX(2px);
  color: var(--vivid-tangerine);
}

/* ================= 7. Floating Modals & Sheets ================= */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.60);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  animation: iosBackdropFadeIn var(--duration-control) var(--ease-ios);
}

@keyframes iosBackdropFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.ops-modal,
.metric-modal {
  width: min(880px, 100%);
  max-height: min(780px, calc(100vh - 40px));
  overflow: hidden;
  border-radius: 28px;
  background: rgba(0, 21, 36, 0.88);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid rgba(255, 236, 209, 0.16);
  box-shadow: inset 0 1px 0 0 rgba(255, 236, 209, 0.25), 0 28px 72px rgba(0, 0, 0, 0.85), 0 0 36px rgba(255, 125, 0, 0.15);
  animation: iosModalPopIn var(--duration-panel) var(--ease-spring);
}

@keyframes iosModalPopIn {
  from {
    opacity: 0;
    transform: scale(0.94) translateY(10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.metric-modal header,
.ops-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 24px;
  background: rgba(255, 236, 209, 0.04);
  border-bottom: 1px solid rgba(255, 236, 209, 0.08);
  color: var(--text-primary);
}

.metric-modal header strong,
.ops-panel-head strong {
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.metric-modal header span,
.ops-panel-head span {
  display: block;
  margin-top: 2px;
  color: var(--text-tertiary);
  font-size: 12px;
}

.metric-modal header button,
.ops-panel-head button[data-close-modal],
.ops-panel-head button {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: var(--radius-pill);
  background: rgba(255, 236, 209, 0.08);
  color: var(--text-secondary);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-ios);
}

.metric-modal header button:hover,
.ops-panel-head button:hover {
  background: rgba(255, 236, 209, 0.18);
  color: var(--papaya-whip);
  transform: scale(1.05);
}

.modal-table-wrap {
  max-height: 600px;
  overflow: auto;
}

.modal-table-wrap table {
  min-width: 640px;
}

.ops-panel-body {
  max-height: calc(88vh - 120px);
  overflow: auto;
  padding: 20px 24px;
}

.ops-search-row,
.watch-form {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.ops-input,
.ops-textarea {
  width: 100%;
  border: 1px solid rgba(255, 236, 209, 0.14);
  border-radius: var(--radius-md);
  background: rgba(255, 236, 209, 0.06);
  color: var(--papaya-whip);
  font-family: inherit;
  font-size: 13.5px;
  transition: border-color var(--duration-control) var(--ease-ios),
              box-shadow var(--duration-control) var(--ease-ios);
}

.ops-input {
  min-height: 40px;
  padding: 0 14px;
}

.ops-textarea {
  min-height: 80px;
  padding: 10px 14px;
  resize: vertical;
}

.ops-input:focus,
.ops-textarea:focus {
  outline: none;
  border-color: var(--vivid-tangerine);
  box-shadow: 0 0 0 3.5px rgba(255, 125, 0, 0.35);
}

/* ================= 8. Analytics Hub & Streamlined Navigation ================= */
.ops-modal.analytics-modal {
  width: min(1160px, calc(100vw - 32px));
  max-height: min(880px, calc(100vh - 32px));
}

.analytics-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 12px 20px;
  background: rgba(255, 236, 209, 0.04);
  border-bottom: 1px solid rgba(255, 236, 209, 0.08);
}

.analytics-tab-btn {
  padding: 8px 18px;
  border: none;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--duration-micro) var(--ease-ios),
              background-color var(--duration-control) var(--ease-ios),
              color var(--duration-control) var(--ease-ios);
}

.analytics-tab-btn:hover {
  background: rgba(255, 236, 209, 0.08);
  color: var(--papaya-whip);
}

.analytics-tab-btn.active {
  background: linear-gradient(135deg, var(--vivid-tangerine) 0%, #E65C00 100%);
  color: var(--ink-black);
  font-weight: 800;
  box-shadow: 0 4px 16px rgba(255, 125, 0, 0.45), inset 0 1px 0 rgba(255, 236, 209, 0.40);
}

/* --- iOS Segmented Period Switcher --- */
.performance-period-segmented-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}

.ios-segmented-control {
  display: inline-flex;
  align-items: center;
  background: var(--color-surface-secondary);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 3px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--color-border);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
  position: relative;
  gap: 2px;
}

.ios-segment-btn {
  background: transparent;
  border: none;
  padding: 6px 18px;
  border-radius: var(--radius-pill);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--duration-control) var(--ease-ios);
  outline: none;
}

.ios-segment-btn:hover:not(.active) {
  color: var(--text-primary);
  background: var(--color-primary-tint);
}

.ios-segment-btn.active {
  background: var(--color-primary);
  color: var(--text-on-primary);
  font-weight: 700;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.20);
}

[data-theme="light"] .ios-segment-btn.active {
  background: #FFFFFF;
  color: var(--color-primary);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.08);
}

.performance-view-body {
  width: 100%;
}

.analytics-container {
  padding: 20px;
  overflow-y: auto;
  max-height: calc(880px - 130px);
}

.analytics-period-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
  padding: 14px 20px;
  border-radius: var(--radius-lg);
  background: var(--color-surface-glass);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--separator-subtle);
  box-shadow: var(--shadow-card), var(--shadow-specular);
}

.analytics-period-selector {
  display: flex;
  align-items: center;
  gap: 8px;
}

.analytics-period-info strong {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
}

.analytics-period-info span {
  font-size: 12px;
  color: var(--text-tertiary);
}

.analytics-kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.analytics-kpi-card {
  padding: 16px 20px;
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--separator-subtle);
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: transform var(--duration-control) var(--ease-spring),
              box-shadow var(--duration-control) var(--ease-ios),
              border-color var(--duration-control) var(--ease-ios);
}

.analytics-kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card), var(--shadow-specular);
  border-color: rgba(255, 125, 0, 0.38);
}

.analytics-kpi-card span {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.analytics-kpi-card strong {
  font-size: 26px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.025em;
}

.analytics-kpi-card.highlight {
  background: rgba(255, 125, 0, 0.12);
  border-color: rgba(255, 125, 0, 0.40);
  box-shadow: 0 0 24px rgba(255, 125, 0, 0.20), var(--shadow-specular);
}

.analytics-kpi-card.highlight strong {
  color: var(--vivid-tangerine);
}

.analytics-delta-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  width: max-content;
  margin-top: 3px;
}

.analytics-delta-badge.positive {
  background: var(--color-success-tint);
  color: var(--color-success);
  border: 1px solid var(--color-success-tint-border);
}

.analytics-delta-badge.negative {
  background: var(--color-danger-tint);
  color: var(--color-danger);
  border: 1px solid var(--color-danger-tint-border);
}

.analytics-delta-badge.neutral {
  background: rgba(255, 236, 209, 0.08);
  color: var(--text-tertiary);
}

.analytics-grid-2col {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
  margin-bottom: 18px;
}

.analytics-card {
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-xl);
  background: var(--color-surface);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  overflow: hidden;
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
  transition: box-shadow var(--duration-panel) var(--ease-ios);
}

.analytics-card:hover {
  box-shadow: var(--shadow-card), var(--shadow-specular);
}

.analytics-card header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: rgba(255, 236, 209, 0.03);
  border-bottom: 1px solid var(--separator-subtle);
}

.analytics-card header strong {
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.analytics-card header span {
  font-size: 12px;
  color: var(--text-tertiary);
}

.analytics-card-body {
  padding: 16px 18px;
}

.channel-bar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  gap: 12px;
}

.channel-bar-label {
  min-width: 55px;
  font-weight: 600;
  font-size: 12.5px;
  color: var(--text-primary);
}

.channel-bar-wrap {
  flex: 1;
  height: 8px;
  background: rgba(255, 236, 209, 0.08);
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.channel-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--stormy-teal) 0%, var(--vivid-tangerine) 100%);
  border-radius: var(--radius-pill);
  transition: width 0.4s var(--ease-ios);
  box-shadow: 0 0 10px rgba(255, 125, 0, 0.4);
}

.channel-bar-count {
  min-width: 60px;
  text-align: right;
  font-size: 11.5px;
  color: var(--text-tertiary);
  font-weight: 600;
}

/* ================= 9. AI Performance Brief Container ================= */
.ai-summary-box {
  border: 1px solid var(--separator-subtle);
  border-left: 4px solid var(--vivid-tangerine);
  border-radius: var(--radius-xl);
  background: var(--color-surface-glass);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  padding: 20px 24px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
  transition: box-shadow var(--duration-panel) var(--ease-ios);
}

.ai-summary-box:hover {
  box-shadow: var(--shadow-card), var(--shadow-specular);
}

.ai-summary-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--separator-subtle);
}

.ai-summary-header strong {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.ai-summary-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  background: rgba(255, 125, 0, 0.16);
  color: var(--vivid-tangerine);
  border: 1px solid rgba(255, 125, 0, 0.35);
  font-size: 11px;
  font-weight: 700;
}

.ai-summary-section {
  margin-bottom: 12px;
}

.ai-summary-section:last-child {
  margin-bottom: 0;
}

.ai-summary-section h4 {
  margin: 0 0 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-primary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.ai-summary-section p,
.ai-summary-section ul {
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-secondary);
}

.ai-summary-section ul {
  padding-left: 18px;
  margin-top: 4px;
}

.ai-summary-section li {
  margin-bottom: 3px;
}

/* ================= 10. Filters, Library & Agent Management ================= */
.intel-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 16px;
  background: var(--color-surface);
  backdrop-filter: blur(24px) saturate(190%);
  -webkit-backdrop-filter: blur(24px) saturate(190%);
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  align-items: center;
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
}

.intel-filter-bar input.ops-input {
  flex: 1;
  min-width: 170px;
}

.intel-filter-bar select.ops-input {
  width: auto;
  min-width: 120px;
}

.intel-stats {
  font-size: 11.5px;
  color: var(--text-tertiary);
  font-weight: 600;
  margin-left: auto;
}

.worksheet-library-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.worksheet-library-readiness {
  margin-bottom: 12px;
  color: var(--text-secondary);
  font-size: 12.5px;
  font-weight: 600;
}

.worksheet-library-weeks {
  display: grid;
  gap: 16px;
  max-height: 480px;
  overflow-y: auto;
}

.worksheet-week header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--separator-subtle);
}

.worksheet-week header strong {
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 700;
}

.worksheet-week header span {
  color: var(--text-tertiary);
  font-size: 11.5px;
}

.worksheet-week-days {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 8px;
}

.worksheet-day-card {
  display: grid;
  gap: 3px;
  padding: 10px 12px;
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-md);
  background: var(--color-surface-secondary);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: default;
  transition: transform var(--duration-control) var(--ease-spring),
              border-color var(--duration-control) var(--ease-ios);
}

.worksheet-day-card strong {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-primary);
}

.worksheet-day-card span {
  color: var(--text-tertiary);
  font-size: 11px;
}

.worksheet-day-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.library-status-pill {
  display: inline-flex;
  align-items: center;
  padding: 1.5px 7px;
  border-radius: var(--radius-pill);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.library-status-pill.full {
  background: var(--color-success-tint);
  color: var(--color-success);
  border: 1px solid var(--color-success-tint-border);
}

.library-status-pill.compact {
  background: var(--color-primary-tint);
  color: var(--vivid-tangerine);
  border: 1px solid rgba(255, 125, 0, 0.35);
}

.worksheet-day-card.has-data {
  cursor: pointer;
  border-color: rgba(255, 125, 0, 0.30);
  background: var(--color-surface);
}

.worksheet-day-card.has-data.has-full-data {
  border-color: var(--color-success-tint-border);
  background: var(--color-surface);
}

.worksheet-day-card.has-data:hover {
  border-color: var(--vivid-tangerine);
  transform: translateY(-2px);
  box-shadow: var(--shadow-card);
}

.worksheet-day-card.missing {
  border-color: var(--color-danger-tint-border);
  background: var(--color-danger-tint);
}

.worksheet-day-card.missing strong {
  color: var(--color-danger);
}

.worksheet-day-card.future {
  opacity: 0.4;
}

/* Agent Management Specifics */
.assign-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.assign-panel-header strong {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
}

.assign-add-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid rgba(255, 236, 209, 0.18);
  border-radius: var(--radius-pill);
  background: rgba(255, 236, 209, 0.08);
  color: var(--vivid-tangerine);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--duration-control) var(--ease-ios);
}

.assign-add-btn:hover {
  background: rgba(255, 125, 0, 0.20);
  border-color: rgba(255, 125, 0, 0.45);
  color: var(--papaya-whip);
}

.assign-add-btn:active {
  transform: scale(0.96);
}

.watchlist-cards {
  display: grid;
  gap: 8px;
  max-height: 440px;
  overflow-y: auto;
}

.watch-card {
  padding: 12px 14px;
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
}

.watch-card:hover {
  box-shadow: var(--shadow-card), var(--shadow-specular);
}

.watch-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.watch-status {
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.watch-status-active {
  background: rgba(255, 125, 0, 0.16);
  color: var(--vivid-tangerine);
  border: 1px solid rgba(255, 125, 0, 0.35);
}

.watch-status-resolved {
  background: rgba(255, 236, 209, 0.08);
  color: var(--text-tertiary);
}

.guidance-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(200px, 1fr));
  gap: 10px;
}

.guidance-card {
  padding: 14px 16px;
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  backdrop-filter: blur(24px) saturate(190%);
  -webkit-backdrop-filter: blur(24px) saturate(190%);
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
  transition: box-shadow var(--duration-panel) var(--ease-ios),
              border-color var(--duration-panel) var(--ease-ios);
}

.guidance-card:hover {
  border-color: rgba(255, 125, 0, 0.38);
  background: var(--color-surface-secondary);
  box-shadow: var(--shadow-card), var(--shadow-specular);
}

.guidance-card strong {
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 700;
  display: block;
  margin-bottom: 4px;
}

.guidance-card span {
  color: var(--text-secondary);
  font-size: 12px;
  line-height: 1.45;
  display: block;
}

.add-agent-modal {
  width: min(380px, 92vw);
  animation: iosModalPopIn var(--duration-panel) var(--ease-spring);
}

.add-agent-form {
  display: grid;
  gap: 10px;
}

.add-agent-form label {
  display: grid;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-secondary);
}

.add-agent-error {
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  background: var(--color-danger-tint);
  color: var(--color-danger);
  font-size: 11.5px;
  font-weight: 600;
}

.assign-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 0 2px;
}

.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 7px;
  border-radius: 50%;
  transition: background-color var(--duration-control) var(--ease-ios);
}

.status-dot-active {
  background: var(--ios-green);
  box-shadow: 0 0 8px rgba(48, 209, 88, 0.7);
}

.status-dot-inactive {
  background: var(--text-quaternary);
}

/* ================= 11. Phase 6.2 Performer & Systemic Miss Components ================= */
.performer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}

.performer-card {
  padding: 16px 20px;
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--separator-subtle);
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: transform var(--duration-control) var(--ease-spring),
              box-shadow var(--duration-control) var(--ease-ios);
}

.performer-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card), var(--shadow-specular);
}

.performer-card.top-performer {
  border-top: 3px solid var(--vivid-tangerine);
}

.performer-card.weak-performer {
  border-top: 3px solid var(--ios-red);
}

.performer-badge {
  display: inline-flex;
  align-items: center;
  width: max-content;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.performer-badge.top {
  background: var(--color-primary-tint);
  color: var(--vivid-tangerine);
  border: 1px solid rgba(255, 125, 0, 0.35);
}

.performer-badge.weak {
  background: var(--color-danger-tint);
  color: var(--ios-red);
  border: 1px solid var(--color-danger-tint-border);
}

.performer-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.performer-desc {
  margin: 0;
  color: var(--text-secondary);
  font-size: 12.5px;
}

.performer-metric {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 0;
  border-top: 1px solid var(--separator-subtle);
  border-bottom: 1px solid var(--separator-subtle);
  font-size: 12.5px;
}

.performer-rate strong {
  color: var(--text-primary);
  font-weight: 700;
}

.performer-tickets {
  color: var(--text-tertiary);
  font-size: 11.5px;
}

.performer-ai {
  padding: 10px 14px;
  background: rgba(255, 236, 209, 0.03);
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-md);
  font-size: 12px;
  line-height: 1.45;
  color: var(--text-secondary);
}

.performer-ai strong {
  color: var(--text-primary);
}

/* Systemic Miss Section & Interactive Drill-Down */
.systemic-miss-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  padding: 16px 20px;
}

.systemic-miss-card {
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  background: var(--color-surface);
  backdrop-filter: blur(24px) saturate(190%);
  -webkit-backdrop-filter: blur(24px) saturate(190%);
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
  transition: box-shadow var(--duration-panel) var(--ease-ios),
              border-color var(--duration-panel) var(--ease-ios);
}

.systemic-miss-card:hover {
  border-color: rgba(255, 125, 0, 0.38);
  box-shadow: var(--shadow-card), var(--shadow-specular);
}

.systemic-miss-card.expanded {
  background: var(--color-surface-secondary);
  border-color: var(--vivid-tangerine);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), var(--shadow-specular);
}

.systemic-miss-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.systemic-miss-title {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.systemic-miss-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 3px;
}

.systemic-count {
  font-size: 12.5px;
  color: var(--text-secondary);
}

.systemic-count strong {
  color: var(--text-primary);
}

.systemic-rate-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--color-danger-tint);
  color: var(--ios-red);
  border: 1px solid var(--color-danger-tint-border);
  font-size: 11px;
  font-weight: 700;
}

.systemic-ai-box {
  margin-top: 8px;
  padding: 8px 12px;
  background: rgba(21, 97, 109, 0.20);
  border: 1px solid rgba(21, 97, 109, 0.38);
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--text-secondary);
}

.systemic-ai-box strong {
  color: var(--vivid-tangerine);
}

.systemic-sop-box {
  margin-top: 6px;
  padding: 8px 12px;
  background: rgba(255, 69, 58, 0.08);
  border: 1px solid rgba(255, 69, 58, 0.22);
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--text-secondary);
}

.systemic-sop-box strong {
  color: var(--ios-red);
}

.systemic-drilldown-panel {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--separator-subtle);
  animation: iosModalPopIn var(--duration-panel) var(--ease-spring);
}

.drilldown-subhead {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 10px;
}

.contributor-rows {
  display: grid;
  gap: 8px;
}

.contributor-row {
  padding: 10px 14px;
  background: var(--color-surface-secondary);
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-sm);
}

.contributor-agent-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.contributor-agent-title span {
  color: var(--text-tertiary);
  font-size: 11.5px;
  font-weight: normal;
}

.contributor-ticket-links {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.agent-drilldown-row td {
  padding: 0 !important;
  background: var(--color-surface-secondary) !important;
}

.drilldown-container {
  padding: 14px 18px;
  border-top: 1px solid var(--separator-subtle);
  border-bottom: 1px solid var(--separator-subtle);
  background: var(--color-surface-secondary);
  animation: iosModalPopIn var(--duration-panel) var(--ease-spring);
}

.drilldown-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.drilldown-header strong {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
}

.drilldown-header span {
  font-size: 11.5px;
  color: var(--text-tertiary);
}

.ticket-chips-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
}

.ticket-chip-card {
  padding: 8px 12px;
  background: var(--color-surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
}

.chip-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}

.chip-channel {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-tertiary);
}

.chip-misses {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
}

/* Compact Period Navigation */
.compact-period-nav {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.period-type-select {
  height: 32px;
  padding: 4px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  background: rgba(255, 236, 209, 0.08);
  border: 1px solid rgba(255, 236, 209, 0.14);
  border-radius: var(--radius-pill);
  cursor: pointer;
  outline: none;
  transition: all var(--duration-control) var(--ease-ios);
}

.period-type-select:focus {
  border-color: var(--vivid-tangerine);
  box-shadow: 0 0 0 3px rgba(255, 125, 0, 0.25);
}

.period-stepper {
  display: inline-flex;
  align-items: center;
  background: rgba(255, 236, 209, 0.06);
  border: 1px solid rgba(255, 236, 209, 0.14);
  border-radius: var(--radius-pill);
  overflow: hidden;
}

.period-stepper-btn {
  background: transparent;
  border: none;
  padding: 6px 12px;
  font-size: 14px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background var(--duration-control) var(--ease-ios), color var(--duration-control) var(--ease-ios);
}

.period-stepper-btn:hover {
  background: rgba(255, 236, 209, 0.14);
  color: var(--papaya-whip);
}

.period-stepper-label {
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  border-left: 1px solid rgba(255, 236, 209, 0.1);
  border-right: 1px solid rgba(255, 236, 209, 0.1);
  user-select: none;
}

/* High-Impact Badge Button */
.high-impact-badge-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  font-size: 11.5px;
  font-weight: 700;
  background: var(--color-danger-tint);
  color: var(--ios-red);
  border: 1px solid var(--color-danger-tint-border);
  cursor: pointer;
  transition: transform var(--duration-control) var(--ease-spring),
              background var(--duration-control) var(--ease-ios);
}

.high-impact-badge-btn:hover {
  transform: scale(1.04);
  background: rgba(255, 69, 58, 0.24);
}

.high-impact-badge-btn.none {
  background: rgba(255, 236, 209, 0.06);
  color: var(--text-tertiary);
  border-color: var(--separator-subtle);
  cursor: default;
}

.high-impact-badge-btn.none:hover {
  transform: none;
  background: rgba(255, 236, 209, 0.06);
}

/* Requirement Miss Interactive Chips */
.req-miss-chips-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;

/* ==========================================================================
   GLOBAL REFINED ICONOGRAPHY & MORPHING SEARCH SYSTEM

:root {
  --icon-xs: 12px;
  --icon-sm: 16px;
  --icon-md: 18px;
  --icon-lg: 22px;
}

/* Unified SVG Icon System */
.app-icon {
  width: var(--icon-sm);
  height: var(--icon-sm);
  display: inline-block;
  vertical-align: -2.5px;
  flex-shrink: 0;
  stroke: currentColor;
}

.app-icon.icon-xs { width: var(--icon-xs); height: var(--icon-xs); }
.app-icon.icon-sm { width: var(--icon-sm); height: var(--icon-sm); }
.app-icon.icon-md { width: var(--icon-md); height: var(--icon-md); }
.app-icon.icon-lg { width: var(--icon-lg); height: var(--icon-lg); }

/* Standalone Icon Button System */
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(255, 236, 209, 0.14);
  background: rgba(255, 236, 209, 0.08);

  -webkit-backdrop-filter: blur(20px);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  transition: all 160ms var(--ease-ios);
  box-shadow: var(--shadow-subtle), var(--shadow-specular);
}

.icon-btn:hover {
  background: var(--color-primary-tint);
  color: var(--papaya-whip);
  border-color: var(--color-primary-tint-border);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(255, 125, 0, 0.25);
}

   -------------------------------------------------------------------------- */

  transition: opacity 100ms var(--ease-ios), transform 100ms var(--ease-ios);
}

.morph-search-bar.expanded .morph-search-content {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
  transition: opacity 200ms var(--ease-ios) 100ms, transform 200ms var(--ease-spring) 100ms;
}

.morph-search-input {
  flex: 1;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  min-width: 0;
  padding: 0 4px;
}

.morph-search-input::placeholder {
  color: var(--text-muted);
  font-size: 12.5px;
  transition: opacity var(--duration-fast) var(--ease-ios);
}

.morph-search-clear-btn {
  width: 22px;
  height: 22px;
  border-radius: var(--radius-pill);
  border: none;
  background: rgba(255, 236, 209, 0.12);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
  transition: background var(--duration-micro) var(--ease-ios), color var(--duration-micro) var(--ease-ios), transform var(--duration-micro) var(--ease-ios);
}

.morph-search-clear-btn:hover {
  background: rgba(255, 236, 209, 0.24);
  color: var(--papaya-whip);
  transform: scale(1.08);
}

.morph-search-clear-btn:active {
  transform: scale(0.92);
}

/* Elevated Popover beneath Search Box */
.morph-search-popover {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 320px;
  background: var(--color-surface-glass);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  border: 1px solid var(--separator-subtle);
  border-radius: var(--radius-xl);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), var(--shadow-specular);
  z-index: 30;
  overflow: hidden;
  animation: iosModalPopIn 160ms var(--ease-spring);
}

.morph-search-popover[hidden] {
  display: none !important;
}

.morph-popover-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 8px;
  background: rgba(255, 236, 209, 0.03);
  border-bottom: 1px solid var(--separator-subtle);
}

.morph-popover-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.morph-popover-count {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}

.morph-popover-results {
  max-height: 280px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.morph-result-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  cursor: pointer;
  border-bottom: 1px solid var(--separator-subtle);
  transition: background 120ms var(--ease-ios);
}

.morph-result-item:last-child {
  border-bottom: none;
}

.morph-result-item:hover {
  background: rgba(255, 236, 209, 0.06);
}

.morph-result-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.morph-result-id-row {
  display: flex;
  align-items: center;
  gap: 4px;
}

.morph-result-id {
  font-size: 13px;
  font-weight: 700;
  color: var(--vivid-tangerine);
  font-variant-numeric: tabular-nums;
}

.morph-result-ext {
  width: 12px;
  height: 12px;
  color: var(--text-muted);
  opacity: 0.7;
}

.morph-result-meta {
  font-size: 11.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.morph-result-status {
  flex-shrink: 0;
}

.morph-clean-pill {
  padding: 2px 8px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ios-green);
  background: var(--color-success-tint);
  border: 1px solid var(--color-success-tint-border);
  border-radius: var(--radius-pill);
}

.morph-miss-pill {
  padding: 2px 8px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ios-red);
  background: var(--color-danger-tint);
  border: 1px solid var(--color-danger-tint-border);
  border-radius: var(--radius-pill);
}

.morph-empty-state {
  padding: 20px 14px;
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
}

@media (prefers-reduced-motion: reduce) {
  .morph-search-bar,
  .morph-search-content,
  .morph-search-icon-btn,
  .morph-search-clear-btn,
  .morph-search-popover {
    transition: none !important;
    animation: none !important;
  }
}

        const db = getFirestore(app);

        try {
          await enableIndexedDbPersistence(db);

            const result = {};

            for (const [id, data] of entries) batch.set(doc(db, col, id), data, { merge });
            await batch.commit();

          onCollection(col, cb) {
            return onSnapshot(
              collection(db, col),
              (snap) => {
                const result = {};
                snap.forEach((d) => {
                  result[d.id] = d.data();
                });
                cb(result, null);
              },
              (err) => cb(null, err),
            );
          },
          onDocument(col, id, cb) {
            return onSnapshot(
              doc(db, col, id),
              (snap) => cb(snap.exists() ? snap.data() : null, null),
              (err) => cb(null, err),
            );
          },
        };

        // window.__fs stays undefined and the app runs fully on localStorage.
      }

    </script>
    <script>

let recentSharedSessions = {};
let activeSessionDate = null;
let sessionBroadcastChannel = null;

try {
  if (typeof BroadcastChannel !== "undefined") {
    sessionBroadcastChannel = new BroadcastChannel("sampler_daily_session");
    sessionBroadcastChannel.onmessage = (event) => {
      const data = event.data;
      if (data?.type === "SESSION_UPLOAD" && data.payload) {
        const dateKey = data.manifest?.samplingDate || data.samplingDate || todayDateKey();
        recentSharedSessions[dateKey] = {
          payload: data.payload,
          manifest: data.manifest,
          reqIntel: data.reqIntel,
          uploadedAt: new Date().toISOString(),
          uploader: data.uploader || "Auditor",
          samplingDate: dateKey,
        };
        activeSessionDate = dateKey;
        if (data.manifest) recordDailyManifest(data.manifest);
        if (data.reqIntel) recordWorkbookRequirementIntelligence(data.reqIntel);
        viewingHistorical = null;
        activatePayload(data.payload, `Done. ${formatWeekdayLabel(dateKey)} Sample loaded for active sampling.`);
        renderTodayCard();
        migrateLegacyStorageIdentities();
        renderHistoricalBanner();
      } else if (data?.type === "SESSION_RESET") {
        recentSharedSessions = {};
        activeSessionDate = null;
        currentPayload = null;
        allTickets = [];
        viewingHistorical = false;
        closeOpsModal();
        renderTodayCard();
        if (typeof render === "function") render();
      }
    };
  }
} catch (_) {}

async function syncDailySessionToServer(payload, manifest, reqIntel) {
  try {
    const dateKey = manifest?.samplingDate || payload?.samplingDate || todayDateKey();
    recentSharedSessions[dateKey] = {
      payload,
      manifest,
      reqIntel,
      uploadedAt: new Date().toISOString(),
      uploader: manifest?.uploader || "Lead Auditor",
      samplingDate: dateKey,
    };
    activeSessionDate = dateKey;

    if (sessionBroadcastChannel) {
      sessionBroadcastChannel.postMessage({
        type: "SESSION_UPLOAD",
        payload,
        manifest,
        reqIntel,
        samplingDate: dateKey,
        uploader: manifest?.uploader,
      });
    }
    if (typeof window !== "undefined" && window.location?.protocol?.startsWith("http")) {
      await fetch("/api/session/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ payload, manifest, reqIntel, uploader: manifest?.uploader }),
      });
    }
  } catch (_) {}
}

async function syncDailySessionResetToServer() {
  try {
    recentSharedSessions = {};
    activeSessionDate = null;
    if (sessionBroadcastChannel) {
      sessionBroadcastChannel.postMessage({ type: "SESSION_RESET" });
    }
    if (typeof window !== "undefined" && window.location?.protocol?.startsWith("http")) {
      await fetch("/api/session/reset", { method: "POST" });
    }
  } catch (_) {}
}

async function checkRemoteDailySession() {
  try {
    if (typeof window !== "undefined" && window.location?.protocol?.startsWith("http")) {
      const res = await fetch("/api/session/active");
      if (res.ok) {
        const data = await res.json();
        if (data?.active && data?.sessions) {
          recentSharedSessions = data.sessions;
          const availableDates = data.availableDates || Object.keys(data.sessions).sort((a, b) => b.localeCompare(a));
          const expectedSampleDate = computeDefaultSamplingDate(todayDateKey());
          
          if (!activeSessionDate || !recentSharedSessions[activeSessionDate]) {
            // Prioritize the expected business sample date for today (e.g. Friday sample on Monday)
            if (recentSharedSessions[expectedSampleDate]) {
              activeSessionDate = expectedSampleDate;
            } else {
              activeSessionDate = availableDates[0];
            }
          }

          const currentSession = recentSharedSessions[activeSessionDate];
          if (currentSession?.payload) {
            if (currentSession.manifest) recordDailyManifest(currentSession.manifest);
            if (currentSession.reqIntel) recordWorkbookRequirementIntelligence(currentSession.reqIntel);
            viewingHistorical = null;
            activatePayload(currentSession.payload, `Done. ${formatWeekdayLabel(currentSession.manifest?.samplingDate || activeSessionDate)} Sample loaded for active sampling.`);
            renderTodayCard();
            renderHistoricalBanner();
          }
        } else if (data && !data.active) {
          // If server was restarted and has 0 sessions in memory, clear local volatile cache
          if (Object.keys(recentSharedSessions).length > 0) {
            recentSharedSessions = {};
            activeSessionDate = null;
            currentPayload = null;
            allTickets = [];
            renderTodayCard();
            if (typeof render === "function") render();
          }
        }
      }
    }
  } catch (_) {}
}

function switchActiveDailySession(targetDate) {
  if (!recentSharedSessions[targetDate]) {
    fetch(`/api/session/day?date=${encodeURIComponent(targetDate)}`)
      .then((r) => r.json())
      .then((data) => {
        if (data?.success && data?.session?.payload) {
          recentSharedSessions[targetDate] = data.session;
          applySessionDateSwitch(targetDate);
        }
      })
      .catch(() => {});
    return;
  }
  applySessionDateSwitch(targetDate);
}

function applySessionDateSwitch(targetDate) {
  const session = recentSharedSessions[targetDate];
  if (!session?.payload) return;
  activeSessionDate = targetDate;
  if (session.manifest) recordDailyManifest(session.manifest);
  if (session.reqIntel) recordWorkbookRequirementIntelligence(session.reqIntel);
  viewingHistorical = null;
  activatePayload(session.payload, `Viewing ${formatWeekdayLabel(session.manifest?.samplingDate || targetDate)} Sample.`);
  renderTodayCard();
  renderHistoricalBanner();
}

// ================= Phase 6 Storage Quota Hardening =================
// Centralized, crash-proof wrapper for all localStorage write operations.
// QuotaExceededError or private browsing restrictions will NEVER interrupt
// active in-memory analysis, sampling, copying, or rendering workflows.
function safeStorageSetItem(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (error) {
    console.warn(`[Sampler Storage] Non-blocking storage failure for key "${key}":`, error);
    if (typeof statusEl !== "undefined" && statusEl) {
      statusEl.textContent = `Notice: Local storage write for ${key} was skipped (${error?.name || "quota limit"}). Current in-memory sampling session remains active.`;
    }
    return false;
  }
}

// ================= Lightweight assignment history =================
// Local cache is capped for display/export performance - Firestore (when
// reachable) is the permanent, uncapped record per "do not overwrite
// history" - every change is a new document there, never trimmed.
// Storage shape (localStorage key "assignmentHistoryV1"), newest first:
//   [{ id, timestamp, agent, from, to, action, changedBy }]
// action is one of "Reassigned" | "Marked Inactive" | "Reactivated" | "Added".
function loadAssignmentHistory() {
  try {
    const items = JSON.parse(localStorage.getItem("assignmentHistoryV1") || "[]");
    return Array.isArray(items) ? items : [];
  } catch {
    return [];
  }
}

let assignmentHistory = loadAssignmentHistory();

  assignmentHistory = assignmentHistory.slice(0, 100);
  safeStorageSetItem("assignmentHistoryV1", JSON.stringify(assignmentHistory));
}

// Writes both to the local cache (immediate, always succeeds) and to the
// shared "assignment_history" Firestore collection (best-effort, fire and
// forget - a failed remote write never blocks the UI or loses the local
// record). Doc ID = the local record's own id, so a retry never creates a
// second copy of the same change.
function logAssignmentHistory(entry) {
  const record = {
    id: `h_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    timestamp: new Date().toISOString(),
    changedBy: currentUpdaterName(),
    ...entry,
  };
  assignmentHistory.unshift(record);
  saveAssignmentHistory();

  const fs = fsBridge();
  if (fs) {
    fs.setDocument("assignment_history", record.id, {
      agentName: record.agent,
      previousAuditor: record.from,
      newAuditor: record.to,
      changedBy: record.changedBy,
      timestamp: record.timestamp,
    }).catch(() => {});
  }
}

// Refresh-based sync, same pattern as loadAgentRegistryFromFirestore(): one
// read on startup (and whenever the Assign Agents panel is opened), no
// onSnapshot. Firestore wins - remote records are merged into the local
// cache, deduped by id, newest first.
async function loadAssignmentHistoryFromFirestore() {
  const fs = fsBridge();
  if (!fs) return;
  try {
    const remote = await fs.getCollection("assignment_history");
    if (!remote || !Object.keys(remote).length) return;
    const remoteRecords = Object.entries(remote).map(([id, data]) => ({
      id,
      timestamp: data.timestamp || new Date(0).toISOString(),
      agent: data.agentName || "",
      from: data.previousAuditor || "(none)",
      to: data.newAuditor || "(none)",
      action: data.action || "Reassigned",
      changedBy: data.changedBy || "Unknown",
    }));
    const byId = new Map(assignmentHistory.map((item) => [item.id, item]));
    for (const record of remoteRecords) byId.set(record.id, record);
    assignmentHistory = [...byId.values()].sort((a, b) => (a.timestamp < b.timestamp ? 1 : -1));
    saveAssignmentHistory();
    if (document.querySelector(".assign-history-table")) refreshAssignHistoryTable();
  } catch {
    // Offline/permission error - keep whatever's already cached locally.
  }
}
